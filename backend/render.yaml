services:
  - type: web
    name: savenserve-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: MONGODB_URL
        sync: false           # Paste your MongoDB Atlas connection string
      - key: FIREBASE_SERVICE_ACCOUNT_KEY_JSON
        sync: false           # Paste the contents of serviceAccountKey.json
      - key: ALLOWED_ORIGINS
        sync: false           # Set to your Netlify URL after frontend deploy
